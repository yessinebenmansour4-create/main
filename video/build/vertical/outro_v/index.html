<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050806; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #cam { transform-origin: 50% 50%; }
      #cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #vignette { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%); }
      .sweep { position: absolute; top: -20%; width: 200px; height: 140%; left: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,250,235,0.22) 50%, rgba(255,255,255,0) 100%);
        transform: rotate(14deg); mix-blend-mode: screen; }
      .ring { position: absolute; left: 50%; top: 50%; width: 526px; height: 526px; margin: -263px 0 0 -263px;
        border: 4px solid rgba(255,255,255,0.9); opacity: 0; }
      #flash { background: #ffffff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
      <div id="cam" class="layer"><img src="bg.jpg" alt="" /></div>
      <div id="vignette" class="layer"></div>
      <div class="sweep" id="sw1"></div>
      <div class="ring" id="r1"></div>
      <div class="ring" id="r2"></div>
      <div id="flash" class="layer"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#flash", { opacity: 1 }, 0);
      tl.to("#flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, 0.03);
      tl.fromTo("#cam", { scale: 2.4, filter: "blur(8px) brightness(1.5)" },
        { scale: 1.04, filter: "blur(0px) brightness(1)", duration: 1.2, ease: "expo.out" }, 0);
      tl.to("#cam", { scale: 1.0, duration: 1.4, ease: "none" }, 1.2);
      tl.fromTo("#r1", { scale: 1, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.9, ease: "power2.out" }, 0.4);
      tl.fromTo("#r2", { scale: 1, opacity: 0.7 }, { scale: 2.1, opacity: 0, duration: 1.1, ease: "expo.out" }, 0.85);
      tl.fromTo("#sw1", { x: -400 }, { x: 1500, duration: 1.0, ease: "power2.inOut" }, 0.7);
      // final scene: fade to black
      tl.to("#cam", { filter: "blur(0px) brightness(0)", duration: 0.7, ease: "power1.in" }, 1.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
