<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* ---------- Talking-head footage, reframed to 9:16 ---------- */
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 40%;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 2880px;
        height: 1620px;
        transform-origin: 0 0;
      }
      #master {
        position: absolute;
        left: 0;
        top: 0;
        width: 2880px;
        height: 1620px;
        object-fit: fill;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="42.3"
      data-width="1080"
      data-height="1920"
    >
      <!-- Edited master: cuts + x1.15 speed-up + loudness already baked in (scripts/build_master.py) -->
      <div id="stage">
        <div id="cam" data-layout-allow-overflow>
          <video
            id="master"
            class="clip"
            src="assets/master.mp4"
            data-start="0"
            data-duration="38.87"
            data-track-index="0"
            playsinline
            data-has-audio="true"
          ></video>
        </div>
      </div>

      <div
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.95"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <div
        id="outro"
        class="clip"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="38.5"
        data-duration="3.8"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
        style="z-index: 10"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------- Virtual camera over the 16:9 master ----------
      // Coordinates of faces are in source pixels (1920x1080); the master is 2880x1620 (x1.5).
      const FW = 1080, FH = 1920, MW = 2880, MH = 1620, K = MW / 1920, BASE = FH / MH;
      const FPS = 30;
      const at = (frame) => frame / FPS - 0.001; // start a move just before the cut frame

      function cam(z, cx, fy) {
        const s = z * BASE;
        const x = Math.min(0, Math.max(FW - MW * s, FW / 2 - cx * K * s));
        const y = Math.min(0, Math.max(FH - MH * s, FH * 0.4 - fy * K * s));
        return { x, y, scale: s };
      }

      function move(t0, t1, from, to, ease) {
        tl.fromTo("#cam", from, { ...to, duration: Math.max(0.01, t1 - t0), ease, immediateRender: t0 <= 0 }, Math.max(0, t0));
      }

      // [startFrame, endFrame, faceX, faceY, zoomIn, zoomOut, punchTime?, punchZoom?]
      // Jump cuts alternate wide/tight framing; slow push-ins keep every shot moving.
      const SHOTS = [
        [0, 71, 869, 404, 1.12, 1.2],
        [71, 195, 908, 432, 1.0, 1.07],
        [195, 261, 880, 424, 1.3, 1.34],
        [261, 292, 903, 420, 1.06, 1.09],
        [292, 325, 920, 470, 1.24, 1.27],
        [325, 462, 907, 434, 1.0, 1.04, 13.12, 1.3], // "survalorisés"
        [462, 514, 910, 426, 1.15, 1.19],
        [514, 523, 925, 423, 1.0, 1.01],
        // 523 -> 593: wide shot, lateral travelling (below)
        [593, 699, 1522, 439, 1.2, 1.24, 22.35, 1.32], // "très spéculatifs" (wide)
        [699, 729, 912, 415, 1.0, 1.03],
        [729, 765, 912, 410, 1.26, 1.29],
        [765, 806, 907, 419, 1.04, 1.08],
        [806, 844, 925, 440, 1.27, 1.3],
        [844, 899, 919, 440, 1.0, 1.03, 29.35, 1.27], // "une bulle"
        [899, 977, 913, 418, 1.12, 1.18],
        [977, 1031, 913, 433, 1.3, 1.33],
        [1031, 1166, 916, 445, 1.0, 1.03, 35.8, 1.22], // "survalorisation"
      ];

      for (const [f0, f1, cx, fy, z0, z1, pt, pz] of SHOTS) {
        const t0 = f0 === 0 ? 0 : at(f0);
        const t1 = at(f1);
        if (pt === undefined) {
          move(t0, t1, cam(z0, cx, fy), cam(z1, cx, fy), "sine.inOut");
        } else {
          const zPre = z0 + (z1 - z0) * ((pt - t0) / (t1 - t0));
          move(t0, pt, cam(z0, cx, fy), cam(zPre, cx, fy), "none");
          move(pt, pt + 0.22, cam(zPre, cx, fy), cam(pz, cx, fy), "power3.out");
          move(pt + 0.22, t1, cam(pz, cx, fy), cam(pz + 0.05, cx, fy), "sine.out");
        }
      }

      // Wide shot: start on the host listening, then travel + push in across the set to the guest.
      // Guest framing stays at zoom >= 1.2 so the source's corner "E" watermark stays out of frame.
      const wideIn = at(523), wideOut = at(593);
      move(wideIn, wideIn + 0.3, cam(1.0, 330, 396), cam(1.0, 345, 396), "none");
      move(wideIn + 0.3, wideIn + 1.55, cam(1.0, 345, 396), cam(1.3, 1515, 440), "power2.inOut");
      move(wideIn + 1.55, wideOut, cam(1.3, 1515, 440), cam(1.33, 1515, 440), "sine.out");

      // ---------- Footage side of the outro transition (outro fades in on top, see compositions/outro.html) ----------
      tl.fromTo("#stage", { scale: 1, filter: "blur(0px)" }, { scale: 1.12, filter: "blur(14px)", duration: 0.37, ease: "power2.in", immediateRender: false }, 38.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
