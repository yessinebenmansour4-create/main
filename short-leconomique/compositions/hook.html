<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="hook-template">
      <style>
        @font-face {
          font-family: "Tinos";
          src: url("../assets/fonts/tinos-latin-700-normal.woff2") format("woff2");
          font-weight: 700;
          font-style: normal;
        }
        @font-face {
          font-family: "Tinos";
          src: url("../assets/fonts/tinos-latin-700-italic.woff2") format("woff2");
          font-weight: 700;
          font-style: italic;
        }
        #hook-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #hook-root .hook-inner {
          width: 100%;
          height: 100%;
          padding: 236px 60px 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        }
        #hook-root .hook-kicker {
          font-family: "Tinos", "Times New Roman", serif;
          font-weight: 700;
          font-size: 36px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #fffbf2;
          background: #08452f;
          border: 2px solid rgba(123, 227, 168, 0.55);
          padding: 10px 30px 12px;
          border-radius: 999px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
        #hook-root .hook-title {
          font-family: "Tinos", "Times New Roman", serif;
          font-weight: 700;
          font-size: 90px;
          line-height: 1.04;
          color: #fffbf2;
          background: radial-gradient(ellipse 120% 160% at 30% 0%, #138a5e 0%, #0b6b48 45%, #075238 100%);
          border: 2px solid rgba(255, 255, 255, 0.16);
          padding: 16px 42px 24px;
          border-radius: 20px;
          box-shadow: 0 16px 44px rgba(3, 40, 26, 0.55);
          white-space: nowrap;
        }
        #hook-root .hook-key {
          position: relative;
          display: inline-block;
          font-style: italic;
          color: #7be3a8;
        }
        #hook-root .hook-underline {
          position: absolute;
          left: 2px;
          right: 6px;
          bottom: -2px;
          height: 7px;
          border-radius: 4px;
          background: #7be3a8;
          transform-origin: 0 50%;
        }
      </style>

      <div id="hook-root" data-composition-id="hook" data-width="1080" data-height="1920">
        <div class="hook-inner">
          <div class="hook-kicker">IA · crypto · immobilier</div>
          <div class="hook-title">
            Où sont les
            <span class="hook-key">bulles<span class="hook-underline"></span></span>&nbsp;?
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(".hook-kicker", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.12);
        tl.fromTo(".hook-title", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.28);
        tl.fromTo(".hook-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.78);
        tl.fromTo(".hook-key", { scale: 1 }, { scale: 1.1, duration: 0.16, ease: "sine.out", yoyo: true, repeat: 1 }, 0.82);
        // Overlay leaves as the guest starts answering
        tl.fromTo(".hook-inner", { y: 0, opacity: 1 }, { y: -60, opacity: 0, duration: 0.32, ease: "power2.in", immediateRender: false }, 2.55);
        window.__timelines["hook"] = tl;
      </script>
    </template>
  </body>
</html>
